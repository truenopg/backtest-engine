[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-engine"
version = "0.1.0"
description = "Event-driven backtesting engine with next-bar fills and realistic costs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Pablo Garcia Ardid"}]
keywords = ["backtesting", "trading", "quantitative-finance", "simulation"]

[project.optional-dependencies]
plot = ["matplotlib"]

[tool.setuptools]
packages = ["bt"]
